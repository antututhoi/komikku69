appId: ${APP_ID}
---
# Android folder picker (opens on the phone's main storage): Download > tour > use it
- tapOn:
    text: "^Download$"
    optional: true
- runFlow:
    when:
      notVisible: "^tour$"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "^Downloads$"
          optional: true
- tapOn:
    text: "^tour$"
    optional: true
- waitForAnimationToEnd
- tapOn: "(?i)use this folder"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- waitForAnimationToEnd
