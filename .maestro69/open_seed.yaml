appId: ${APP_ID}
---
# Android file picker: Downloads > tour > seed.tachibk
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "seed.tachibk"
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible: "seed.tachibk"
    commands:
      - tapOn: "Show roots"
      - waitForAnimationToEnd
      - tapOn: "^Downloads$"
      - waitForAnimationToEnd
      - tapOn:
          text: "^tour$"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "seed.tachibk"
    timeout: 5000
    optional: true
- takeScreenshot: 19_file_picker
- tapOn: "seed.tachibk"
