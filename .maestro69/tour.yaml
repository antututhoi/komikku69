appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01_first_screen
- runFlow: onboarding.yaml
- takeScreenshot: 02_after_first_run
- tapOn: {text: "(?i)^library$", optional: true}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: 03_library
- tapOn: {text: "(?i)^(favou?rites)$", optional: true}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: 04_favourites
- tapOn: {text: "(?i)^(updates|feed|recents)$", optional: true}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: 05_updates
- tapOn: {text: "(?i)^history$", optional: true}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: 06_history
- tapOn: {text: "(?i)^(browse|explore|sources)$", optional: true}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: 07_browse
- runFlow:
    when:
      true: ${KIND == 'mihon'}
    file: seed_mihon.yaml
- tapOn: {text: "(?i)^(more|settings|menu)$", optional: true}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: 40_more
- tapOn: {text: "(?i)^settings$", optional: true}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: 41_settings
- scroll
- takeScreenshot: 42_settings_scrolled
