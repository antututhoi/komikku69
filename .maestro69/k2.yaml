appId: ${APP_ID}
---
- runFlow:
    when: {true: "${APP_NAME == 'Futon'}"}
    commands:
      - tapOn: {text: "(?i)^no thanks$", optional: true}
      - tapOn: {id: ".*nav_explore"}
      - tapOn: {text: "(?i)^no thanks$", optional: true}
- runFlow:
    when: {true: "${APP_NAME == 'DropSauce'}"}
    commands:
      - tapOn: {point: "78%,93%"}
- waitForAnimationToEnd: {timeout: 3000}
- takeScreenshot: k03_explore
- runFlow:
    when: {true: "${APP_NAME == 'DropSauce'}"}
    commands:
      - tapOn: {id: ".*search_bar"}
- runFlow:
    when: {true: "${APP_NAME == 'Kaisoku' || APP_NAME == 'Futon'}"}
    commands:
      - tapOn: {text: "Search manga"}
- runFlow:
    when: {true: "${APP_NAME == 'Kototoro'}"}
    commands:
      - tapOn: {text: "Search\\.\\.\\."}
- inputText: "Blue Lock"
- pressKey: Enter
- waitForAnimationToEnd: {timeout: 30000}
- takeScreenshot: k04_search

- takeScreenshot: k05_search_later
