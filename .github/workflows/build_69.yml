name: Build 69-Komikku

on:
  push:
    branches:
      - mod69
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key (same key every build)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/my.keystore"
          echo "MOD69_KEYSTORE=$RUNNER_TEMP/my.keystore" >> "$GITHUB_ENV"
          echo "MOD69_KEY_PASSWORD=ytdlnis123" >> "$GITHUB_ENV"

      - name: Use Gradle's second download address (main one times out)
        run: |
          sed -i -e 's#services.gradle.org/distributions#downloads.gradle.org/distributions#' \
            -e 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 69-komikku-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Put the APK on the Releases page (latest build)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release delete mod69-latest --yes --cleanup-tag || true
          gh release create mod69-latest app/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "69-Komikku build #${{ github.run_number }}" \
            --notes "$NOTES"

