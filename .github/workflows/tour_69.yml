name: 69 Virtual phone

# Runs only when the tour69 branch is pushed (never touches the mod69 builds).
on:
  push:
    branches:
      - tour69

concurrency:
  group: tour69
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Allow the virtual phone to run fast (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .maestro69/get_apks.sh

      - name: Install Maestro (taps and screenshots)
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start the virtual phone and run the tour
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .maestro69/run_all.sh

      - name: Save screenshots, videos and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-results
          path: out69/

      - name: Put screenshots and video frames on the tour69-results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          for d in out69/*/; do
            mkdir -p "$d/frames" "$d/shots"
            for v in "$d"tour_*.mp4; do
              [ -f "$v" ] || continue; k=$(basename "$v" .mp4)
              ffmpeg -loglevel error -i "$v" -vf "fps=1/3,scale=360:-1" -q:v 6 "$d/frames/${k}_%03d.jpg" || true
            done
            find "$d/m" -name '*.png' 2>/dev/null | while read -r p; do
              ffmpeg -loglevel error -y -i "$p" -vf "scale=540:-1" -q:v 4 "$d/shots/$(basename "$p" .png).jpg" || true
            done
            rm -rf "$d/m"
          done
          mkdir -p /tmp/res && rsync -a --exclude '*.mp4' out69/ /tmp/res/
          cd /tmp/res && git init -q && git checkout -q -b tour69-results
          git add -A && git -c user.name=tour69 -c user.email=tour69@users.noreply.github.com commit -qm "tour results ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" tour69-results
